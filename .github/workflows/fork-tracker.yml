name: fork-tracker

# Records the repo's fork count once a day into data/forks_history.csv
# and refreshes the FORK_HISTORY table in the READMEs.

on:
  schedule:
    - cron: "0 0 * * *"        # daily at 00:00 UTC
  workflow_dispatch:           # allow manual trigger from the Actions tab

permissions:
  contents: write              # needed to commit the updated CSV/READMEs

jobs:
  track:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update fork history
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python scripts/update_forks.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/forks_history.csv README.md README.zh-CN.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update fork history [skip ci]"
            git push
          fi
