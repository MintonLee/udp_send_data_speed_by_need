# ======================================================
#  udp_send_data_speed_by_need 发送端程序 配置文件
#  格式: key=value ，以 # 或 ; 开头的行是注释
#  修改后重新运行 ./run.sh 即可生效（无需重新编译）
# ======================================================

# 目标IP（接收端地址）
dest_ip = 127.0.0.1

# 目标端口（与接收端一致）
dest_port = 6000

# 单个UDP包的数据段长度（字节）。整包 = 数据段 + 10 字节(帧头FS+seq+len+帧尾FE)
# 建议 <= 1462，使整包不超过以太网 MTU 1500，避免 IP 分片
data_len = 1024

# 起始包序号（seq 从该值开始逐包递增）
start_seq = 0

# 发送包数上限，0=不限
#   文件模式 file_loop=0：发完整个文件即停
#   文件模式 file_loop=1 ：无限循环发送直到 Ctrl+C 或达到 send_count
send_count = 0

# ---------------- 数据来源 ----------------
# data_source: file=从二进制文件发送（默认）; pattern=生成测试数据
data_source = file

# 数据文件路径（按二进制读取，任意内容均可）
# 用 scripts/gen_data.py 生成测试文件，例如 128MB 随机二进制：
#   python3 scripts/gen_data.py -o ./data/sample.bin -s 128MB
data_file = ./data/sample.bin

# 文件循环发送: 1=循环发送直到 Ctrl+C 或达到 send_count; 0=文件发完即停
file_loop = 0

# pattern 模式的数据内容: inc=递增 / random=随机 / zero=全零
# （仅 data_source=pattern 时生效）
data_pattern = inc

# ---------------- 发送限速 ----------------
# 目标发送速率（Mbps，按有效数据字节速率计，1Mbps=1e6 bit/s）
# 例如 160Mbps ≈ 20MB/s；0=不限速全力发送
target_rate_mbps = 160

# 限速节奏窗口（毫秒）：每发送约「该时长对应的数据量」后统一 sleep 校正一次。
# 值越大限速越平稳（建议 >=1ms，避免逐包 sleep 受内核 timer slack 影响导致速率不准）
pace_interval_ms = 2

# 套接字发送缓冲区大小（字节），高速率建议 >= 4MB
# 若被内核上限截断，按启动日志提示执行: sudo sysctl -w net.core.wmem_max=4194304
send_buffer_size = 4194304

# 详细日志开关: 1=开（逐包打印） 0=关
verbose = 0
